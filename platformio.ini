; ==============================================================================
; Aegis-Beacon PlatformIO Configuration
; Target: ESP32 DevKit V1 (30-pin, Espressif ESP32-WROOM-32)
; Radio:  Ebyte E22-400M30S (SX1262 / LLCC68)
; Display: SSD1309 2.42" 128x64 OLED (software SPI, U8g2)
; GPS:    NEO-6M (UART2)
; ==============================================================================

[platformio]
default_envs = esp32dev
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<website/**>

lib_deps =
    jgromes/RadioLib @ ^6.6.0
    bblanchon/ArduinoJson @ ^7.0.0
    olikraus/U8g2 @ ^2.34.0
    mikalhart/TinyGPSPlus @ ^1.0.3

build_flags =
    -DBOARD_HAS_PSRAM=0

board_build.flash_size = 4MB
board_build.partitions = default.csv
build_type = release
