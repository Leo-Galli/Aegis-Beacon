<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a5c2a"/>
      <stop offset="100%" stop-color="#0f3d1a"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a04a"/>
      <stop offset="100%" stop-color="#b8862d"/>
    </linearGradient>
    <linearGradient id="solder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="#0a0a0a"/>
  <rect x="1" y="1" width="798" height="518" rx="11" stroke="#333" stroke-width="1" fill="none"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="monospace" font-size="11" fill="#ea580c" font-weight="bold" letter-spacing="3">AEGIS-BEACON v5.4 — PCB PROTOTYPE LAYOUT</text>

  <!-- PCB Board -->
  <rect x="100" y="60" width="600" height="380" rx="8" fill="url(#pcb)" stroke="#2d7a3f" stroke-width="2" filter="url(#shadow)"/>

  <!-- PCB Grid Pattern -->
  <g opacity="0.15" stroke="#4ade80" stroke-width="0.3">
    <line x1="100" y1="100" x2="700" y2="100"/>
    <line x1="100" y1="140" x2="700" y2="140"/>
    <line x1="100" y1="180" x2="700" y2="180"/>
    <line x1="100" y1="220" x2="700" y2="220"/>
    <line x1="100" y1="260" x2="700" y2="260"/>
    <line x1="100" y1="300" x2="700" y2="300"/>
    <line x1="100" y1="340" x2="700" y2="340"/>
    <line x1="100" y1="380" x2="700" y2="380"/>
    <line x1="100" y1="420" x2="700" y2="420"/>
    <line x1="140" y1="60" x2="140" y2="440"/>
    <line x1="180" y1="60" x2="180" y2="440"/>
    <line x1="220" y1="60" x2="220" y2="440"/>
    <line x1="260" y1="60" x2="260" y2="440"/>
    <line x1="300" y1="60" x2="300" y2="440"/>
    <line x1="340" y1="60" x2="340" y2="440"/>
    <line x1="380" y1="60" x2="380" y2="440"/>
    <line x1="420" y1="60" x2="420" y2="440"/>
    <line x1="460" y1="60" x2="460" y2="440"/>
    <line x1="500" y1="60" x2="500" y2="440"/>
    <line x1="540" y1="60" x2="540" y2="440"/>
    <line x1="580" y1="60" x2="580" y2="440"/>
    <line x1="620" y1="60" x2="620" y2="440"/>
    <line x1="660" y1="60" x2="660" y2="440"/>
  </g>

  <!-- Mounting Holes -->
  <circle cx="120" cy="80" r="6" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
  <circle cx="680" cy="80" r="6" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
  <circle cx="120" cy="420" r="6" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
  <circle cx="680" cy="420" r="6" fill="#0a0a0a" stroke="#333" stroke-width="1"/>

  <!-- ESP32 DevKit Module (left side) -->
  <rect x="130" y="120" width="120" height="200" rx="3" fill="#1a1a2e" stroke="#444" stroke-width="1.5"/>
  <rect x="135" y="125" width="110" height="190" rx="2" fill="#16213e"/>
  <!-- ESP32 chip -->
  <rect x="160" y="175" width="60" height="60" rx="2" fill="#0f0f23" stroke="#555" stroke-width="0.5"/>
  <text x="190" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#ea580c">ESP32</text>
  <text x="190" y="212" text-anchor="middle" font-family="monospace" font-size="5" fill="#888">DUAL CORE</text>
  <text x="190" y="222" text-anchor="middle" font-family="monospace" font-size="5" fill="#888">240 MHz</text>
  <!-- ESP32 pins left -->
  <g fill="url(#copper)">
    <rect x="130" y="130" width="4" height="8" rx="1"/><rect x="130" y="145" width="4" height="8" rx="1"/>
    <rect x="130" y="160" width="4" height="8" rx="1"/><rect x="130" y="175" width="4" height="8" rx="1"/>
    <rect x="130" y="190" width="4" height="8" rx="1"/><rect x="130" y="205" width="4" height="8" rx="1"/>
    <rect x="130" y="220" width="4" height="8" rx="1"/><rect x="130" y="235" width="4" height="8" rx="1"/>
    <rect x="130" y="250" width="4" height="8" rx="1"/><rect x="130" y="265" width="4" height="8" rx="1"/>
    <rect x="130" y="280" width="4" height="8" rx="1"/><rect x="130" y="295" width="4" height="8" rx="1"/>
  </g>
  <!-- ESP32 pins right -->
  <g fill="url(#copper)">
    <rect x="246" y="130" width="4" height="8" rx="1"/><rect x="246" y="145" width="4" height="8" rx="1"/>
    <rect x="246" y="160" width="4" height="8" rx="1"/><rect x="246" y="175" width="4" height="8" rx="1"/>
    <rect x="246" y="190" width="4" height="8" rx="1"/><rect x="246" y="205" width="4" height="8" rx="1"/>
    <rect x="246" y="220" width="4" height="8" rx="1"/><rect x="246" y="235" width="4" height="8" rx="1"/>
    <rect x="246" y="250" width="4" height="8" rx="1"/><rect x="246" y="265" width="4" height="8" rx="1"/>
    <rect x="246" y="280" width="4" height="8" rx="1"/><rect x="246" y="295" width="4" height="8" rx="1"/>
  </g>
  <!-- ESP32 label -->
  <text x="190" y="335" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff" font-weight="bold">ESP32 DevKit V1</text>

  <!-- SX1262 RF Module (center) -->
  <rect x="290" y="100" width="140" height="100" rx="3" fill="#1a1a2e" stroke="#444" stroke-width="1.5"/>
  <rect x="295" y="105" width="130" height="90" rx="2" fill="#16213e"/>
  <!-- SX1262 chip -->
  <rect x="325" y="120" width="70" height="50" rx="2" fill="#0f0f23" stroke="#555" stroke-width="0.5"/>
  <text x="360" y="142" text-anchor="middle" font-family="monospace" font-size="7" fill="#ea580c">SX1262</text>
  <text x="360" y="154" text-anchor="middle" font-family="monospace" font-size="5" fill="#888">+30 dBm PA</text>
  <!-- SMA Connector -->
  <circle cx="430" cy="150" r="12" fill="#c0c0c0" stroke="#888" stroke-width="1.5"/>
  <circle cx="430" cy="150" r="5" fill="#333"/>
  <circle cx="430" cy="150" r="2" fill="url(#copper)"/>
  <!-- Module pins -->
  <g fill="url(#copper)">
    <rect x="290" y="110" width="8" height="4" rx="1"/><rect x="290" y="125" width="8" height="4" rx="1"/>
    <rect x="290" y="140" width="8" height="4" rx="1"/><rect x="290" y="155" width="8" height="4" rx="1"/>
    <rect x="290" y="170" width="8" height="4" rx="1"/><rect x="290" y="185" width="8" height="4" rx="1"/>
  </g>
  <text x="360" y="215" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff" font-weight="bold">E22-400M30S</text>

  <!-- OLED Display -->
  <rect x="290" y="230" width="130" height="80" rx="3" fill="#000" stroke="#333" stroke-width="1.5"/>
  <rect x="296" y="236" width="118" height="68" rx="2" fill="#001100"/>
  <!-- OLED Content -->
  <text x="355" y="258" text-anchor="middle" font-family="monospace" font-size="8" fill="#00ff00" opacity="0.9">AEGIS-BEACON</text>
  <text x="355" y="272" text-anchor="middle" font-family="monospace" font-size="6" fill="#00cc00" opacity="0.8">MODE: BEACON</text>
  <text x="355" y="284" text-anchor="middle" font-family="monospace" font-size="6" fill="#00cc00" opacity="0.8">FREQ: 433.500</text>
  <text x="355" y="296" text-anchor="middle" font-family="monospace" font-size="6" fill="#00ff00" opacity="0.9">SOS DE MARIO</text>
  <!-- OLED pins -->
  <g fill="url(#copper)">
    <rect x="290" y="240" width="6" height="3" rx="0.5"/><rect x="290" y="250" width="6" height="3" rx="0.5"/>
    <rect x="290" y="260" width="6" height="3" rx="0.5"/><rect x="290" y="270" width="6" height="3" rx="0.5"/>
    <rect x="290" y="280" width="6" height="3" rx="0.5"/><rect x="290" y="290" width="6" height="3" rx="0.5"/>
    <rect x="290" y="300" width="6" height="3" rx="0.5"/>
  </g>
  <text x="355" y="325" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff" font-weight="bold">SSD1309 OLED 2.42"</text>

  <!-- GPS Module (NEO-6M) -->
  <rect x="460" y="100" width="100" height="70" rx="3" fill="#1a1a2e" stroke="#444" stroke-width="1.5"/>
  <rect x="465" y="105" width="90" height="60" rx="2" fill="#16213e"/>
  <!-- GPS chip -->
  <rect x="480" y="115" width="60" height="35" rx="2" fill="#0f0f23" stroke="#555" stroke-width="0.5"/>
  <text x="510" y="132" text-anchor="middle" font-family="monospace" font-size="6" fill="#00bfff">NEO-6M</text>
  <text x="510" y="144" text-anchor="middle" font-family="monospace" font-size="4" fill="#888">GPS MODULE</text>
  <!-- GPS antenna pad -->
  <circle cx="510" cy="160" r="4" fill="url(#copper)" stroke="#888" stroke-width="0.5"/>
  <text x="510" y="185" text-anchor="middle" font-family="monospace" font-size="7" fill="#fff" font-weight="bold">NEO-6M GPS</text>

  <!-- Battery (18650) -->
  <rect x="460" y="200" width="100" height="110" rx="6" fill="#2d2d2d" stroke="#555" stroke-width="1.5"/>
  <rect x="465" y="205" width="90" height="100" rx="4" fill="#1a1a1a"/>
  <rect x="480" y="210" width="60" height="10" rx="3" fill="#444"/>
  <text x="510" y="245" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff" font-weight="bold">18650</text>
  <text x="510" y="258" text-anchor="middle" font-family="monospace" font-size="6" fill="#888">3.7V 3000mAh</text>
  <text x="510" y="272" text-anchor="middle" font-family="monospace" font-size="5" fill="#ea580c">Li-ion Cell</text>
  <text x="510" y="286" text-anchor="middle" font-family="monospace" font-size="5" fill="#888">~65h Runtime</text>
  <text x="510" y="325" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff" font-weight="bold">18650 Battery</text>

  <!-- TP4056 Charger -->
  <rect x="460" y="330" width="60" height="40" rx="2" fill="#1a1a2e" stroke="#444" stroke-width="1"/>
  <rect x="465" y="335" width="50" height="30" rx="1" fill="#16213e"/>
  <text x="490" y="352" text-anchor="middle" font-family="monospace" font-size="5" fill="#ea580c">TP4056</text>
  <text x="490" y="362" text-anchor="middle" font-family="monospace" font-size="4" fill="#888">CHARGER</text>
  <!-- USB-C Port -->
  <rect x="520" y="338" width="20" height="12" rx="2" fill="#888" stroke="#666" stroke-width="1"/>
  <rect x="524" y="341" width="12" height="6" rx="1" fill="#333"/>
  <text x="490" y="385" text-anchor="middle" font-family="monospace" font-size="7" fill="#fff" font-weight="bold">TP4056 Charger</text>

  <!-- Audio Circuit -->
  <rect x="130" y="350" width="100" height="50" rx="2" fill="#1a1a2e" stroke="#444" stroke-width="1"/>
  <rect x="135" y="355" width="90" height="40" rx="1" fill="#16213e"/>
  <!-- Audio components -->
  <rect x="145" y="365" width="12" height="6" rx="1" fill="url(#copper)"/>
  <text x="151" y="370" text-anchor="middle" font-family="monospace" font-size="3" fill="#000">100R</text>
  <rect x="165" y="363" width="8" height="10" rx="1" fill="#333"/>
  <text x="169" y="370" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">10uF</text>
  <!-- 3.5mm Jack -->
  <circle cx="210" cy="375" r="6" fill="#333" stroke="#555" stroke-width="1"/>
  <circle cx="210" cy="375" r="2.5" fill="#111"/>
  <text x="180" y="415" text-anchor="middle" font-family="monospace" font-size="7" fill="#fff" font-weight="bold">Audio Output</text>

  <!-- LEDs -->
  <circle cx="270" cy="370" r="5" fill="#ff0000" opacity="0.8" filter="url(#glow)"/>
  <circle cx="270" cy="370" r="3" fill="#ff3333"/>
  <text x="270" y="388" text-anchor="middle" font-family="monospace" font-size="5" fill="#ff6666">RED</text>

  <circle cx="290" cy="370" r="5" fill="#0066ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="290" cy="370" r="3" fill="#3388ff"/>
  <text x="290" y="388" text-anchor="middle" font-family="monospace" font-size="5" fill="#6699ff">BLUE</text>

  <!-- Copper Traces (decorative) -->
  <g stroke="url(#copper)" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 250 200 L 280 200 L 280 150 L 290 150"/>
    <path d="M 250 220 L 270 220 L 270 260 L 290 260"/>
    <path d="M 430 150 L 450 150 L 450 140 L 460 140"/>
    <path d="M 360 230 L 360 220 L 480 220 L 480 200"/>
    <path d="M 190 320 L 190 350"/>
    <path d="M 490 330 L 490 310"/>
  </g>

  <!-- Component Callout Lines -->
  <g stroke="#ea580c" stroke-width="0.8" stroke-dasharray="4 2" opacity="0.6">
    <!-- ESP32 callout -->
    <line x1="100" y1="220" x2="130" y2="220"/>
    <!-- SX1262 callout -->
    <line x1="430" y1="100" x2="430" y2="90"/>
    <!-- OLED callout -->
    <line x1="355" y1="330" x2="355" y2="340"/>
    <!-- GPS callout -->
    <line x1="560" y1="140" x2="580" y2="140"/>
    <!-- Battery callout -->
    <line x1="560" y1="260" x2="580" y2="260"/>
    <!-- Charger callout -->
    <line x1="540" y1="370" x2="580" y2="370"/>
  </g>

  <!-- External Callout Labels -->
  <g font-family="monospace" font-size="8" fill="#ea580c">
    <text x="585" y="143">GPIO 5/18/23/19 — SPI</text>
    <text x="585" y="263">GPIO 32 — ADC</text>
    <text x="585" y="373">USB-C Charging</text>
  </g>

  <!-- Signal Wave Animation (decorative) -->
  <g opacity="0.3" fill="none" stroke="#ea580c" stroke-width="1">
    <path d="M 442 150 Q 460 130 478 150 Q 496 170 514 150" />
    <path d="M 450 150 Q 468 125 486 150 Q 504 175 522 150" opacity="0.5"/>
    <path d="M 458 150 Q 476 120 494 150 Q 512 180 530 150" opacity="0.3"/>
  </g>

  <!-- Bottom Info Bar -->
  <rect x="100" y="450" width="600" height="35" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="120" y="465" font-family="monospace" font-size="8" fill="#888">BOARD:</text>
  <text x="165" y="465" font-family="monospace" font-size="8" fill="#fff">100x60mm Hammond 1593L</text>
  <text x="340" y="465" font-family="monospace" font-size="8" fill="#888">LAYERS:</text>
  <text x="395" y="465" font-family="monospace" font-size="8" fill="#fff">2-layer FR4</text>
  <text x="490" y="465" font-family="monospace" font-size="8" fill="#888">BOM:</text>
  <text x="520" y="465" font-family="monospace" font-size="8" fill="#ea580c" font-weight="bold">~$23-28 USD</text>

  <text x="120" y="478" font-family="monospace" font-size="7" fill="#666">FREQ: 410-525 MHz | TX: +22 dBm | RX: -130 dBm | SLEEP: 10uA | RUNTIME: 65h</text>

  <!-- Corner branding -->
  <text x="790" y="510" text-anchor="end" font-family="monospace" font-size="7" fill="#333">AEGIS OPEN SOURCE PROJECT</text>
</svg>
