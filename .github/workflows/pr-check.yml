name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Node.js syntax for all files
        run: |
          cd website
          node --check server.js
          node --check api/index.js
          node --check translations.js
          node --check views/layout.js
          node --check views/landing.js
          node --check views/wiki.js
          node --check views/manual.js
          node --check views/demo.js
          node --check views/builder.js
          node --check views/status.js
          node --check views/wiki/layout.js
          for f in views/wiki/*.js; do node --check "$f"; done
          echo "All syntax checks passed"

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd website && npm ci
      - name: Run full check suite
        run: cd website && npm run check

  route-check:
    name: Route Verification
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify all routes render correctly
        run: |
          cd website
          node --input-type=module -e "
          import { renderLandingPage } from './views/landing.js';
          import { renderWikiPage } from './views/wiki.js';
          import { renderDemoPage } from './views/demo.js';
          import { renderBuilderPage } from './views/builder.js';
          import { renderManualPage } from './views/manual.js';
          import { renderStatusPage } from './views/status.js';
          const routes = [
            ['/', renderLandingPage],
            ['/wiki', renderWikiPage],
            ['/demo', renderDemoPage],
            ['/builder', renderBuilderPage],
            ['/manual', renderManualPage],
            ['/status', renderStatusPage]
          ];
          let ok = true;
          for (const [path, fn] of routes) {
            const html = await fn();
            if (html.length < 1000) { console.error('FAIL: ' + path + ' returned only ' + html.length + ' bytes'); ok = false; }
            else { console.log('OK: ' + path + ' (' + html.length + ' bytes)'); }
          }
          if (!ok) process.exit(1);
          console.log('All routes verified successfully');
          "

  i18n-check:
    name: Translation Validation
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate translation dictionaries
        run: |
          cd website
          node -e "import('./translations.js').then(m => { const missing = m.validateDictionaries(); const bad = Object.entries(missing).filter(([, v]) => v.length); if (bad.length) { console.error('Missing keys:', JSON.stringify(bad)); process.exit(1); } console.log('Translations OK'); })"

  link-check:
    name: Internal Link Validation
    runs-on: ubuntu-latest
    needs: route-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check internal links in wiki pages
        run: |
          cd website
          node --input-type=module -e "
          import { readFileSync } from 'fs';
          import { renderPage as renderOverview } from './views/wiki/overview.js';
          import { renderPage as renderHardware } from './views/wiki/hardware.js';
          import { renderPage as renderFirmware } from './views/wiki/firmware.js';
          import { renderPage as renderAssembly } from './views/wiki/assembly.js';
          const pages = [
            ['overview', renderOverview],
            ['hardware', renderHardware],
            ['firmware', renderFirmware],
            ['assembly', renderAssembly]
          ];
          let ok = true;
          for (const [id, fn] of pages) {
            const html = await fn();
            const links = html.match(/href=\"\/wiki\/[^\"]+\"/g) || [];
            for (const link of links) {
              const path = link.match(/href=\"([^\"]+)\"/)[1];
              if (!path.startsWith('/wiki/')) continue;
              console.log(id + ': ' + path);
            }
          }
          console.log('Link check passed');
          "

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - name: Check for common security issues
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -r "password\|secret\|api_key\|token" --include="*.js" --include="*.json" website/ | grep -v node_modules | grep -v ".env" | grep -vi "no password\|no secret\|without\|optional\|missing\|none\|null\|undefined\|placeholder\|example\|test\|mock\|dummy\|fake"; then
            echo "WARNING: Potential hardcoded secrets found"
            exit 1
          fi
          echo "No hardcoded secrets found"

          echo "Checking for eval usage..."
          if grep -r "eval(" --include="*.js" website/ | grep -v node_modules; then
            echo "WARNING: eval() usage detected"
            exit 1
          fi
          echo "No eval() usage found"

          echo "Security check passed"

  seo-check:
    name: SEO Validation
    runs-on: ubuntu-latest
    needs: route-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate SEO elements in pages
        run: |
          cd website
          node --input-type=module -e "
          import { renderLandingPage } from './views/landing.js';
          import { renderPage as renderOverview } from './views/wiki/overview.js';
          const pages = [
            ['/', renderLandingPage],
            ['/wiki/overview', renderOverview]
          ];
          let ok = true;
          for (const [path, fn] of pages) {
            const html = await fn();
            const checks = {
              'title': /<title>[^<]+<\/title>/.test(html),
              'meta-description': /<meta name=\"description\"/.test(html),
              'canonical': /<link rel=\"canonical\"/.test(html),
              'og-title': /<meta property=\"og:title\"/.test(html),
              'og-description': /<meta property=\"og:description\"/.test(html),
              'og-image': /<meta property=\"og:image\"/.test(html),
              'viewport': /<meta name=\"viewport\"/.test(html),
              'theme-color': /<meta name=\"theme-color\"/.test(html)
            };
            for (const [check, passed] of Object.entries(checks)) {
              if (!passed) { console.error(path + ': FAIL - missing ' + check); ok = false; }
              else { console.log(path + ': OK - ' + check); }
            }
          }
          if (!ok) process.exit(1);
          console.log('SEO validation passed');
          "

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check code quality
        run: |
          echo "Checking file sizes..."
          find website/views -name "*.js" -exec wc -l {} \; | sort -rn | head -10
          echo ""

          echo "Checking for console.log in production..."
          if grep -r "console.log" --include="*.js" website/views/ website/api/; then
            echo "INFO: console.log found in view files (may be intentional for debugging)"
          fi

          echo "Checking for TODO/FIXME comments..."
          grep -rn "TODO\|FIXME\|HACK\|XXX" --include="*.js" website/ | grep -v node_modules || echo "No TODO/FIXME found"

          echo ""
          echo "Code quality check passed"
