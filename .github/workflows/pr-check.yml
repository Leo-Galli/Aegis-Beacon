name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Astro build
        run: |
          cd website
          npm ci
          npm run check
          echo "All syntax checks passed"

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd website && npm ci
      - name: Run Astro check
        run: cd website && npm run check

  route-check:
    name: Route Verification
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify all page files exist and build
        run: |
          cd website
          echo "=== Page verification ==="
          PAGES=("index.astro" "demo.astro" "builder.astro" "wiki/[...slug].astro")
          for page in "${PAGES[@]}"; do
            if [ -f "src/pages/$page" ]; then
              echo "OK: src/pages/$page exists"
            else
              echo "FAIL: src/pages/$page not found"
              exit 1
            fi
          done
          echo "All pages verified successfully"

  i18n-check:
    name: Translation Validation
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate wiki content files
        run: |
          cd website
          CONTENT_COUNT=$(ls src/content/wiki/*.md 2>/dev/null | wc -l)
          echo "Found $CONTENT_COUNT wiki content files"
          if [ "$CONTENT_COUNT" -lt 5 ]; then
            echo "FAIL: Expected at least 5 wiki content files"
            exit 1
          fi
          echo "Wiki content OK"

  link-check:
    name: Internal Link Validation
    runs-on: ubuntu-latest
    needs: route-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check wiki content structure
        run: |
          cd website
          echo "=== Wiki content validation ==="
          for f in src/content/wiki/*.md; do
            NAME=$(basename "$f" .md)
            # Check file has content (at least title)
            if head -5 "$f" | grep -q '^#'; then
              echo "OK: $NAME has title"
            else
              echo "WARNING: $NAME may be missing title"
            fi
            # Check file is non-trivial
            SIZE=$(wc -c < "$f")
            if [ "$SIZE" -gt 100 ]; then
              echo "OK: $NAME has content ($SIZE bytes)"
            else
              echo "FAIL: $NAME is too small ($SIZE bytes)"
              exit 1
            fi
          done
          echo "Wiki content structure validated"

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - name: Check for common security issues
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -r "password\|secret\|api_key\|token" --include='*.astro' --include='*.ts' --include='*.js' --include='*.json' website/src/ website/public/ 2>/dev/null | grep -v node_modules | grep -v ".env" | grep -vi "no password\|no secret\|without\|optional\|missing\|none\|null\|undefined\|placeholder\|example\|test\|mock\|dummy\|fake"; then
            echo "WARNING: Potential hardcoded secrets found"
            exit 1
          fi
          echo "No hardcoded secrets found"

          echo "Checking for eval usage..."
          if grep -r "eval(" --include='*.astro' --include='*.ts' --include='*.js' website/src/ 2>/dev/null | grep -v node_modules; then
            echo "WARNING: eval() usage detected"
            exit 1
          fi
          echo "No eval() usage found"

          echo "Security check passed"

  seo-check:
    name: SEO Validation
    runs-on: ubuntu-latest
    needs: route-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate SEO elements in pages
        run: |
          cd website
          echo "=== SEO validation ==="
          ok=true
          for page in src/pages/index.astro; do
            echo "Checking $page..."
            for tag in '<title>' '<meta name="description"' '<link rel="canonical"' '<meta property="og:title"' '<meta property="og:description"' '<meta property="og:image"' '<meta name="viewport"' '<meta name="theme-color"'; do
              if grep -q "$tag" "$page"; then
                echo "  OK: $tag found"
              else
                echo "  FAIL: $tag not found"
                ok=false
              fi
            done
          done
          if [ "$ok" = "false" ]; then exit 1; fi
          echo "SEO validation passed"

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check code quality
        run: |
          echo "Checking file sizes..."
          find website/src -name "*.astro" -o -name "*.ts" | xargs wc -l 2>/dev/null | sort -rn | head -10
          echo ""

          echo "Checking for console.log in production..."
          if grep -r "console.log" --include='*.astro' --include='*.ts' website/src/ 2>/dev/null; then
            echo "INFO: console.log found in source files"
          else
            echo "OK: No console.log in source files"
          fi

          echo "Checking for TODO/FIXME comments..."
          grep -rn "TODO\|FIXME\|HACK\|XXX" --include='*.astro' --include='*.ts' website/src/ 2>/dev/null || echo "No TODO/FIXME found"

          echo ""
          echo "Code quality check passed"
