name: Website CI

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'

jobs:
  check:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: npm run check

      - name: Check for common issues
        run: |
          echo "=== Checking for common issues ==="
          # Check for hardcoded localhost
          echo "Checking for hardcoded localhost..."
          if grep -rn 'localhost' src/ --include='*.astro' --include='*.ts' --include='*.js' | grep -v node_modules | grep -v SITE_URL; then
            echo "WARNING: Found hardcoded localhost references"
          else
            echo "OK: No hardcoded localhost"
          fi

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Verify routes exist
        run: |
          echo "=== Route verification ==="
          ROUTES=("index.astro" "demo.astro" "builder.astro" "wiki/[...slug].astro")
          for route in "${ROUTES[@]}"; do
            if [ -f "src/pages/$route" ]; then
              echo "OK: src/pages/$route exists"
            else
              echo "FAIL: src/pages/$route not found"
              exit 1
            fi
          done
          echo "All routes verified"

      - name: Verify wiki content
        run: |
          echo "=== Wiki content verification ==="
          CONTENT_COUNT=$(ls src/content/wiki/*.md 2>/dev/null | wc -l)
          echo "Found $CONTENT_COUNT wiki content files"
          if [ "$CONTENT_COUNT" -lt 5 ]; then
            echo "FAIL: Expected at least 5 wiki content files"
            exit 1
          fi
          echo "Wiki content OK"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Check for security patterns
        run: |
          echo "=== Checking security patterns ==="
          # Check for eval usage
          if grep -r 'eval(' src/ --include='*.astro' --include='*.ts' --include='*.js' 2>/dev/null | grep -v node_modules; then
            echo "WARNING: eval() found in source"
            exit 1
          else
            echo "OK: No eval() in source"
          fi
          # Check for dangerous innerHTML usage
          INNER_COUNT=$(grep -rc 'innerHTML' src/ --include='*.astro' --include='*.ts' --include='*.js' 2>/dev/null | awk -F: '{s+=$2}END{print s+0}')
          echo "innerHTML usage count: $INNER_COUNT"
          # Check for hardcoded secrets
          SECRET_COUNT=$(grep -rn 'password\|secret\|api_key\|token' src/ --include='*.astro' --include='*.ts' --include='*.js' 2>/dev/null | grep -v node_modules | grep -vi 'no password\|no secret\|without\|optional\|missing\|none\|null\|undefined\|placeholder\|example\|test' | wc -l)
          echo "Potential hardcoded secrets: $SECRET_COUNT"
          echo "Security check passed"

  assign-reviewer:
    name: Assign Reviewer
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Assign Leo-Galli as reviewer
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers: ['Leo-Galli']
            });
            console.log('Assigned Leo-Galli as reviewer');
