name: Website CI

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Astro type checks
        run: npm run check

      - name: Verify every wiki page is registered in navigation
        run: |
          echo "=== Wiki navigation coverage ==="
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('src/content/wiki').filter(f => f.endsWith('.md')).map(f => f.replace(/\.md$/, ''));
            const nav = fs.readFileSync('src/lib/wiki-nav.ts', 'utf8');
            const missing = files.filter(id => !nav.includes(\"id: '\" + id + \"'\"));
            const orphans = [...nav.matchAll(/id: '([^']+)'/g)].map(m => m[1]).filter(id => !files.includes(id));
            if (missing.length || orphans.length) {
              console.error('Missing from nav:', missing);
              console.error('In nav but no file:', orphans);
              process.exit(1);
            }
            console.log('OK: all', files.length, 'wiki pages registered, none orphaned');
          "

      - name: Content quality checks
        run: |
          echo "=== Emoji check ==="
          if grep -rInP '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]' src/content/wiki src/pages src/layouts src/components 2>/dev/null | grep -v '\.map:'; then
            echo "FAIL: emoji found in site content"
            exit 1
          fi
          echo "OK: no emoji"

          echo "=== Em-dash check in UI source ==="
          if grep -rIn '—' src/pages src/layouts src/components --include='*.astro' --include='*.ts' 2>/dev/null; then
            echo "FAIL: em-dash found in UI source"
            exit 1
          fi
          echo "OK: no em-dashes in UI source"

          echo "=== AI / co-author strings check ==="
          if grep -rIli 'co-authored-by\|generated with\|codebuff\|claude' src/ 2>/dev/null | grep -v node_modules; then
            echo "FAIL: AI or co-author references found in source"
            exit 1
          fi
          echo "OK: no AI references"

          echo "=== Hardcoded localhost check ==="
          if grep -rn "http://localhost\|http://127.0.0.1" src/ --include='*.astro' --include='*.ts' --include='*.js' | grep -v node_modules; then
            echo "FAIL: hardcoded localhost found"
            exit 1
          fi
          echo "OK: no localhost references"

          echo "=== External font/CDN references check ==="
          if grep -rn "fonts.googleapis\|fonts.gstatic\|cdnjs.cloudflare\|unpkg.com\|cdn.jsdelivr" src/ public/ --include='*.astro' --include='*.ts' --include='*.js' --include='*.css' 2>/dev/null; then
            echo "FAIL: external font/CDN reference found"
            exit 1
          fi
          echo "OK: all fonts self-hosted"

          echo "=== TODO / FIXME audit ==="
          if grep -rn "TODO\|FIXME\|HACK\|XXX" src/ --include='*.astro' --include='*.ts' --include='*.js' 2>/dev/null | grep -v node_modules; then
            echo "WARNING: untracked TODOs remain (not blocking)"
          fi

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify built output (sitemap, robots, SEO, links)
        run: node ../.github/scripts/verify-website.mjs

      - name: List build output
        run: |
          echo "Built pages:"
          find dist -name '*.html' | wc -l
          echo "Sitemap URLs:"
          grep -o '<loc>[^<]*' dist/sitemap-0.xml | wc -l

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true

      - name: Static security pattern scan
        run: |
          echo "=== eval() usage ==="
          if grep -rn "eval(" src/ --include='*.astro' --include='*.ts' --include='*.js' 2>/dev/null | grep -v node_modules; then
            echo "WARNING: eval() found in source"
            exit 1
          fi
          echo "OK: no eval() in source"

          echo "=== innerHTML usage (informational) ==="
          grep -rn "innerHTML" src/ --include='*.astro' --include='*.ts' 2>/dev/null | wc -l

          echo "=== Hardcoded secrets ==="
          SECRET_COUNT=$(grep -rniE 'password|secret|api[_-]?key|bearer|token' src/ --include='*.astro' --include='*.ts' --include='*.js' 2>/dev/null | grep -v node_modules | grep -viE 'no password|no secret|without|optional|missing|none|null|undefined|placeholder|example|test|mock|dummy|token[- ]?\b(key|ring)?' | wc -l)
          echo "Potential hardcoded secrets: $SECRET_COUNT"
