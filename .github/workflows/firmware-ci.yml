name: Firmware CI

on:
  push:
    branches: [main]
    paths:
      - '*.ino'
      - 'platformio.ini'
      - 'src/**'
      - 'include/**'
  pull_request:
    branches: [main]
    paths:
      - '*.ino'
      - 'platformio.ini'
      - 'src/**'
      - 'include/**'

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - espressif32:esp32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build firmware
        run: pio run

      - name: Check firmware size
        run: |
          echo "=== Firmware Size Report ==="
          pio run --target size || true

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Check for common issues
        run: |
          echo "=== Checking .ino file structure ==="
          if [ -f "AegisBeacon.ino" ]; then
            echo "Main .ino file found"
            # Check for required includes
            for lib in RadioLib U8g2lib TinyGPS++; do
              if grep -q "#include.*${lib}" AegisBeacon.ino; then
                echo "OK: ${lib} included"
              else
                echo "WARNING: ${lib} not found in includes"
              fi
            done
            # Check for serial output
            if grep -q "Serial.begin" AegisBeacon.ino; then
              echo "OK: Serial initialized"
            else
              echo "WARNING: Serial.begin() not found"
            fi
            # Check for watchdog
            if grep -q "esp_task_wdt\|wdt_enable\|yield()" AegisBeacon.ino; then
              echo "OK: Watchdog or yield found"
            else
              echo "INFO: No explicit watchdog calls found"
            fi
            # Check for deep sleep
            if grep -q "esp_deep_sleep_start\|deepSleep" AegisBeacon.ino; then
              echo "OK: Deep sleep implementation found"
            else
              echo "WARNING: Deep sleep not found"
            fi
          else
            echo "WARNING: AegisBeacon.ino not found in root"
          fi

      - name: Validate platformio.ini
        run: |
          if [ -f "platformio.ini" ]; then
            echo "=== platformio.ini contents ==="
            cat platformio.ini
            echo ""
            echo "=== Checking required fields ==="
            for field in board platform framework lib_deps monitor_speed; do
              if grep -q "^${field}" platformio.ini; then
                echo "OK: ${field} configured"
              else
                echo "WARNING: ${field} not found"
              fi
            done
          else
            echo "ERROR: platformio.ini not found"
            exit 1
          fi

  assign-reviewer:
    name: Assign Reviewer
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Assign Leo-Galli as reviewer
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers: ['Leo-Galli']
            });
            console.log('Assigned Leo-Galli as reviewer');
