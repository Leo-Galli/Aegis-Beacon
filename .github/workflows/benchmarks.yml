name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - '*.ino'
      - 'platformio.ini'
      - 'src/**'
      - 'include/**'
      - 'website/**'
      - '.github/workflows/benchmarks.yml'
      - '.github/scripts/benchmark-*.mjs'
      - '.github/scripts/merge-benchmarks.mjs'
      - '!website/src/data/benchmarks.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip && python -m pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: bench-${{ runner.os }}-${{ runner.arch }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            bench-${{ runner.os }}-${{ runner.arch }}-pio-

      - name: Run firmware benchmark
        run: node .github/scripts/benchmark-firmware.mjs

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: bench-firmware-${{ runner.os }}-${{ runner.arch }}
          path: bench-firmware.json
          retention-days: 7

  website:
    name: Website build benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run website build benchmark
        run: node ../.github/scripts/benchmark-website.mjs

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: bench-website-ubuntu-x64
          path: bench-website.json
          retention-days: 7

  report:
    name: Report benchmark results
    runs-on: ubuntu-latest
    needs: [firmware, website]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: bench-*
          path: artifacts

      - name: Merge results and render run summary
        run: |
          node .github/scripts/merge-benchmarks.mjs artifacts /tmp/benchmarks-report.json
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/tmp/benchmarks-report.json', 'utf8'));
            const runs = data.runs ?? [];
            const lines = ['## Benchmark results', ''];
            lines.push('| Platform | Kind | Commit | Build time | Size |');
            lines.push('|---|---|---|---|---|');
            for (const r of runs.slice(0, 20)) {
              const size = r.kind === 'firmware'
                ? r.flashPct + '% flash / ' + r.ramPct + '% RAM'
                : r.pages + ' pages';
              lines.push('| ' + r.runner + ' | ' + r.kind + ' | ' + r.shortSha + ' | ' + (r.buildMs / 1000).toFixed(1) + ' s | ' + size + ' |');
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            console.log('Reported ' + runs.length + ' benchmark run(s) in the workflow summary.');
          "

      - name: Upload merged report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-report
          path: /tmp/benchmarks-report.json
          retention-days: 7